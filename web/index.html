n value="5000000">До 5 млн ₽</option></select></label><label>Двигатель<select name="fuel"><option value="all">Любой</option><option value="electric">Электро</option><option value="hybrid">Гибрид</option></select></label><label>Кузов<select name="body"><option value="all">Любой</option><option value="suv">Кроссовер</option><option value="sedan">Седан</option><option value="wagon">Универсал</option></select></label></div></details></div><div class="picker-footer"><div id="selected-preview" hidden></div><div class="filter-actions"><button type="button" id="reset-draft">Сбросить</button><button type="submit" class="primary" id="apply-filters">Показать автомобили</button></div></div></form></dialog><dialog id="photo-dialog" aria-label="Просмотр фотографии"><button class="close" aria-label="Закрыть фотографию">×</button><img id="photo-image" alt=""><div id="photo-caption"></div></dialog><div id="toast" role="status"></div><script src="app.js?v=9"></script></body></html>
